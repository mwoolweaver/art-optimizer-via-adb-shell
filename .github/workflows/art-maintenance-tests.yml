name: ART Maintenance Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  package-pipeline:
    name: Package Pipeline Laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      TMPDIR: /tmp
      LAB_ROOT: /tmp/art-pipeline-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mksh
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y mksh

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail

          mksh -n maintenance.sh
          mksh -n test/laboratory.sh
          mksh -n test/make_test_fixtures.sh

      - name: Create test fixtures
        shell: bash
        run: |
          set -euo pipefail

          mksh test/make_test_fixtures.sh

      - name: Run package-pipeline laboratory
        shell: bash
        run: |
          set -euo pipefail

          mksh test/laboratory.sh
