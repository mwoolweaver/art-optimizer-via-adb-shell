name: Auto-Minify Maintenance Script

on:
  push:
    branches:
      - main
    paths:
      - "maintenance.sh"

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Minify maintenance.sh
        run: |
          python3 -c '
          with open("maintenance.sh", "r") as f:
              lines = f.readlines()
          out = []
          for idx, line in enumerate(lines):
              if idx == 0 and line.startswith("#!"):
                  out.append(line)
                  continue
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              out.append(line)
          with open("maintenance.sh", "w") as f:
              f.writelines(out)
          '

      - name: Push to minification branch
        run: |
          git checkout -b minification
          git add maintenance.sh
          git commit -m "Auto-minify maintenance.sh from main [skip ci]" || echo "No changes to commit"
          git push origin minification --force
