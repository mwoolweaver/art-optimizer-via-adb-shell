name: Auto-Minify Maintenance Script & README

on:
  push:
    branches:
      - main
    paths:
      - "maintenance.sh"
      - "README.md"
  workflow_dispatch:

jobs:
  minify-and-inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout minification branch
        uses: actions/checkout@v4
        with:
          ref: minification
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest maintenance.sh and README.md from main
        run: |
          git fetch origin main
          git checkout origin/main -- maintenance.sh README.md

      - name: Minify maintenance.sh
        run: |
          python3 -c '
          with open("maintenance.sh", "r") as f:
              lines = f.readlines()
          out = []
          for idx, line in enumerate(lines):
              if idx == 0 and line.startswith("#!"):
                  out.append(line)
                  continue
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              out.append(line)
          with open("maintenance.sh", "w") as f:
              f.writelines(out)
          '

      - name: Verify shell script syntax
        run: bash -n maintenance.sh

      - name: Inject minified script into README.md
        run: |
          python3 -c '
          with open("maintenance.sh", "r") as f:
              code = f.read()
          with open("README.md", "r") as f:
              readme = f.read()
          start, end = "<!-- SCRIPT_START -->", "<!-- SCRIPT_END -->"
          if start in readme and end in readme:
              pre = readme.split(start)[0]
              post = readme.split(end)[1]
              heredoc_block = "cat << '\''EOF'\'' > /sdcard/monthly/minification-maintenance.sh\n" + code + "EOF"
              new_readme = f"{pre}{start}\n```bash\n{heredoc_block}\n```\n{end}{post}"
              with open("README.md", "w") as f:
                  f.write(new_readme)
          '

      - name: Update minification-maintenance.sh
        run: |
          mv maintenance.sh minification-maintenance.sh

      - name: Commit and push changes
        run: |
          git add minification-maintenance.sh README.md
          git commit -m "Sync latest README and minified script from main [skip ci]" || echo "No changes to commit"
          git push origin minification
