name: Auto-Minify Maintenance Script

on:
  push:
    branches:
      - main
    paths:
      - "maintenance.sh"
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Minify maintenance.sh
        run: |
          python3 -c '
          with open("maintenance.sh", "r") as f:
              lines = f.readlines()
          out = []
          for idx, line in enumerate(lines):
              if idx == 0 and line.startswith("#!"):
                  out.append(line)
                  continue
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              out.append(line)
          with open("maintenance.sh", "w") as f:
              f.writelines(out)
          '

      - name: Verify shell script syntax
        run: bash -n maintenance.sh

      - name: Inject minified script into README.md
        run: |
          python3 -c '
          with open("maintenance.sh", "r") as f:
              code = f.read()
          with open("README.md", "r") as f:
              readme = f.read()
          start, end = "<!-- START_MINIFIED -->", "<!-- END_MINIFIED -->"
          if start in readme and end in readme:
              pre = readme.split(start)[0]
              post = readme.split(end)[1]
              new_readme = f"{pre}{start}\n```sh\n{code}\n```\n{end}{post}"
              with open("README.md", "w") as f:
                  f.write(new_readme)
          '

      - name: Push to minification branch
        run: |
          git checkout -b minification
          git add maintenance.sh README.md
          git commit -m "Auto-minify maintenance.sh and update README [skip ci]" || echo "No changes to commit"
          git push origin minification --force
