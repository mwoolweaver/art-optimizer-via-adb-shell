name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Auto-Format All Repository Files & Inject Script
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          # Clean up any residual data files
          rm -f shellcheck-results.json shellcheck-results.sarif

          echo "[+] 1. Auto-formatting all Shell scripts (.sh)..."
          /home/runner/bin/shfmt -w -ln mksh -i 4 .

          echo "[+] 2. Normalizing all Markdown files (.md)..."
          python3 -c '
          import glob
          for f in glob.glob("**/*.md", recursive=True, include_hidden=True):
              if ".git/" in f or "/.git" in f: continue
              with open(f, "r", encoding="utf-8") as file:
                  lines = [line.rstrip() for line in file.readlines()]
              content = "\n".join(lines).strip() + "\n"
              with open(f, "w", encoding="utf-8") as file:
                  file.write(content)
          '

          echo "[+] 3. Checking maintenance.sh for script re-injection..."

          # Check 1: Modified by shfmt during this run (uncommitted working tree diff)
          WAS_FORMATTED=false
          if ! git diff --quiet maintenance.sh; then
            WAS_FORMATTED=true
          fi

          # Check 2: Modified in the commit itself (HEAD~1 vs HEAD)
          WAS_IN_COMMIT=false
          if git rev-parse HEAD~1 &>/dev/null && git diff --name-only HEAD~1 HEAD | grep -q "^maintenance.sh$"; then
            WAS_IN_COMMIT=true
          fi

          if [ "$WAS_IN_COMMIT" = true ] || [ "$WAS_FORMATTED" = true ]; then
            COMMIT_INFO=$(git log -1 --format="%h ('%s' by %an)" 2>/dev/null || echo "${GITHUB_SHA:-unknown}")

            if [ "$WAS_IN_COMMIT" = true ] && [ "$WAS_FORMATTED" = true ]; then
              echo "[+] Changes detected in maintenance.sh from commit $COMMIT_INFO AND automated shfmt formatting. Injecting new script version into README.md..."
            elif [ "$WAS_IN_COMMIT" = true ]; then
              echo "[+] Changes detected in maintenance.sh from commit $COMMIT_INFO. Injecting new script version into README.md..."
            else
              echo "[+] Changes detected in maintenance.sh via automated shfmt formatting. Injecting new script version into README.md..."
            fi

            awk '/<!-- SCRIPT_START -->/{
              print
              print "```bash"
              print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
              while ((getline line < "maintenance.sh") > 0) {
                sub(/\r$/, "", line)
                print line
              }
              close("maintenance.sh")
              print "EOF"
              print "```"
              flag=1
              next
            }
            /<!-- SCRIPT_END -->/{
              flag=0
            }
            !flag' README.md > README.md.tmp && mv README.md.tmp README.md
          else
            echo "[=] maintenance.sh was not modified. Skipping README script injection."
          fi

      - name: Create Pull Request for File Sync
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "style/docs: auto-format, lint, and sync repository files"
          title: "style/docs: auto-format and sync repository files"
          branch: "auto-update-readme"
          base: "main"
          delete-branch: true
