name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
    paths:
      - 'maintenance.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Apply Principle of Least Privilege by scoping write access specifically to this job
    permissions:
      contents: write
      security-events: write
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          # Required to prevent 'git pull --rebase' from crashing due to truncated history
          fetch-depth: 0

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v4

      - name: Auto-fix script formatting
        # Standardize mksh syntax with 4-space indentation
        shell: bash
        run: shfmt -w -ln mksh -i 4 maintenance.sh

      - name: Lint shell script for mksh
        # Run shellcheck with '|| true' so non-zero exits don't halt workflow before SARIF generation
        shell: bash
        run: |
          shellcheck -s ksh -f json maintenance.sh > shellcheck-results.json || true
          
          # Convert ShellCheck JSON output into GitHub-compatible SARIF 2.1.0 format using native jq
          jq '{
            "$schema": "https://schemastore.org/json/sarif-2.1.0-rtm.5.json",
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "ShellCheck", "version": "latest" } },
              "results": [
                .[] | {
                  "ruleId": ("SC" + (.code | tostring)),
                  "message": { "text": .message },
                  "level": (if .level == "error" then "error" elif .level == "warning" then "warning" else "note" end),
                  "locations": [{
                    "physicalLocation": {
                      "artifactLocation": { "uri": .file },
                      "region": {
                        "startLine": .line,
                        "startColumn": .column,
                        "endLine": .endLine,
                        "endColumn": .endColumn
                      }
                    }
                  }]
                }
              ]
            }]
          }' shellcheck-results.json > shellcheck-results.sarif
          
          # Fail step on syntax/security errors to block downstream README injection
          HAS_ERRORS=$(jq 'any(.[]; .level == "error")' shellcheck-results.json)
          if [ "$HAS_ERRORS" = "true" ]; then
            echo "::error::ShellCheck found critical syntax or security errors!"
            exit 42
          fi

      - name: Upload ShellCheck results to GitHub Security
        # Ensure security report uploads even if linting flagged critical errors
        if: always() && steps.checkout.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shellcheck-results.sarif

      - name: Inject and Commit
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          # Replace content between markdown marker tags with a heredoc representation of maintenance.sh
          awk '/<!-- SCRIPT_START -->/{
            print
            print "```bash"
            print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
            while ((getline line < "maintenance.sh") > 0) print line
            close("maintenance.sh")
            print "EOF"
            print "```"
            flag=1
            next
          }
          /<!-- SCRIPT_END -->/{
            flag=0
          }
          !flag' README.md > README.md.tmp && mv README.md.tmp README.md

          git add maintenance.sh README.md
          
          # Only create a commit if formatted files or README content actually changed
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            # Bypass hooks for speed, and rebase prior to push to prevent non-fast-forward crashes
            git commit --no-verify -m "style/docs: auto-format maintenance.sh and inject into README"
            git pull --rebase origin main
            git push
          fi
