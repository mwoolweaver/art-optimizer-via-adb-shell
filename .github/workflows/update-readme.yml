name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and inject maintenance.sh
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files maintenance.sh and/or README.md are missing."
            exit 1
          fi

          README_BEFORE_HASH=$(git hash-object README.md)

          echo "[+] Validating README injection markers and injecting maintenance.sh..."

          python3 <<'PYTHON'
          from pathlib import Path

          readme_path = Path("README.md")
          script_path = Path("maintenance.sh")

          start_marker = "<!-- SCRIPT_START -->"
          end_marker = "<!-- SCRIPT_END -->"
          heredoc_marker = "__ART_MAINTENANCE_SCRIPT_EOF__"

          # Read raw bytes so this workflow does not silently normalize line
          # endings outside the injected block. Formatting belongs to Gatekeeper.
          readme = readme_path.read_bytes().decode("utf-8")
          script = script_path.read_bytes().decode("utf-8")

          if "\r" in readme:
              raise SystemExit(
                  "README.md contains carriage returns. "
                  "Fix formatting before README synchronization."
              )

          if "\r" in script:
              raise SystemExit(
                  "maintenance.sh contains carriage returns. "
                  "Fix formatting before README synchronization."
              )

          if readme.count(start_marker) != 1:
              raise SystemExit(
                  "README.md must contain exactly one "
                  "<!-- SCRIPT_START --> marker."
              )

          if readme.count(end_marker) != 1:
              raise SystemExit(
                  "README.md must contain exactly one "
                  "<!-- SCRIPT_END --> marker."
              )

          if readme.index(start_marker) >= readme.index(end_marker):
              raise SystemExit(
                  "README.md SCRIPT_START marker must appear before "
                  "SCRIPT_END."
              )

          if heredoc_marker in script.splitlines():
              raise SystemExit(
                  f"maintenance.sh contains reserved heredoc marker: "
                  f"{heredoc_marker}"
              )

          script = script.rstrip("\n")

          replacement = (
              f"{start_marker}\n"
              "```bash\n"
              f"cat << '{heredoc_marker}' "
              "> /sdcard/monthly/maintenance.sh\n"
              f"{script}\n"
              f"{heredoc_marker}\n"
              "```\n"
              f"{end_marker}"
          )

          before, remainder = readme.split(start_marker, 1)
          _, after = remainder.split(end_marker, 1)

          readme_path.write_bytes(
              (before + replacement + after).encode("utf-8")
          )
          PYTHON

          README_AFTER_HASH=$(git hash-object README.md)

          echo "=========================================="
          echo " README SYNCHRONIZATION REPORT:"

          if [ "$README_BEFORE_HASH" != "$README_AFTER_HASH" ]; then
            echo " [UPDATED] README.md script block was desynchronized and has been regenerated."
          else
            echo " [CLEAN] README.md is already synchronized with maintenance.sh."
          fi

          echo "=========================================="

      - name: Create pull request for README sync
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          commit-message: "docs: sync maintenance.sh into README"
          title: "docs: sync maintenance.sh into README"
          branch: "auto-update-readme"
          base: "main"
          delete-branch: true
