name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
    paths:
      - 'maintenance.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      security-events: write
      
    steps:
      - name: Checkout repository
        id: checkout
        # Pinned to actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup shfmt
        # AIRTIGHT FIX: Pinned via the full-length commit SHA mapping to v4.0.1
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          architecture: amd64

      - name: Auto-fix script formatting
        shell: bash
        run: /usr/local/bin/shfmt -w -ln mksh -i 4 maintenance.sh

      - name: Lint shell script for mksh
        shell: bash
        run: |
          set -euo pipefail
          
          shellcheck -s ksh -f json maintenance.sh > shellcheck-results.json
          
          jq '{
            "$schema": "https://schemastore.org",
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "ShellCheck", "version": "latest" } },
              "results": [
                .[] | {
                  "ruleId": ("SC" + (.code | tostring)),
                  "message": { "text": .message },
                  "level": (if .level == "error" then "error" elif .level == "warning" then "warning" else "note" end),
                  "locations": [{
                    "physicalLocation": {
                      "artifactLocation": { "uri": .file },
                      "region": {
                        "startLine": .line,
                        "startColumn": .column,
                        "endLine": .endLine,
                        "endColumn": .endColumn
                      }
                    }
                  }]
                }
              ]
            }]
          }' shellcheck-results.json > shellcheck-results.sarif
          
          if jq 'any(.[]; .level == "error")' shellcheck-results.json | grep -q "true"; then
            echo "::error::ShellCheck found critical syntax or security errors!"
            exit 42
          fi

      - name: Upload ShellCheck results to GitHub Security
        if: always() && steps.checkout.outcome == 'success'
        # AIRTIGHT FIX: Pinned via the full-length commit SHA mapping to v4.37.9
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: shellcheck-results.sarif

      - name: Inject and Commit
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          inject_script_content() {
            awk '/<!-- SCRIPT_START -->/{
              print
              print "```bash"
              print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
              while ((getline line < "maintenance.sh") > 0) print line
              close("maintenance.sh")
              print "EOF"
              print "```"
              flag=1
              next
            }
            /<!-- SCRIPT_END -->/{
              flag=0
            }
            !flag' README.md
          }

          inject_script_content > README.md.tmp && mv README.md.tmp README.md
          git add maintenance.sh README.md
          
          if ! git diff --staged --quiet; then
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git commit --no-verify -m "style/docs: auto-format maintenance.sh and inject into README"
            git pull --rebase origin main
            git push
          fi
