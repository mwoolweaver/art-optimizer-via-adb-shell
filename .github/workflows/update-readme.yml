name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      security-events: write
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Lint all repository files
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Starting full repository linting..."

          # 1. Shell scripts (.sh): Validated via ShellCheck
          find . -name "*.sh" -not -path "./.git/*" | while read -r file; do
            echo "  Linting shell script: $file"
            shellcheck -s ksh -f json "$file" >> shellcheck-results.json
          done

          if [ -f "shellcheck-results.json" ]; then
            jq '{
              "$schema": "https://schemastore.org",
              "version": "2.1.0",
              "runs": [{
                "tool": { "driver": { "name": "ShellCheck", "version": "latest" } },
                "results": [
                  .[] | {
                    "ruleId": ("SC" + (.code | tostring)),
                    "message": { "text": .message },
                    "level": (if .level == "error" then "error" elif .level == "warning" then "warning" else "note" end),
                    "locations": [{
                      "physicalLocation": {
                        "artifactLocation": { "uri": .file },
                        "region": {
                          "startLine": .line,
                          "startColumn": .column,
                          "endLine": .endLine,
                          "endColumn": .endColumn
                        }
                      }
                    }]
                  }
                ]
              }]
            }' shellcheck-results.json > shellcheck-results.sarif
          else
            echo "[]" > shellcheck-results.json
            echo '{"$schema":"https://schemastore.org","version":"2.1.0","runs":[{"tool":{"driver":{"name":"ShellCheck","version":"latest"}},"results":[]}]}' > shellcheck-results.sarif
          fi

          if jq 'any(.[]; .level == "error")' shellcheck-results.json | grep -q "true"; then
            echo "::error::ShellCheck found critical syntax errors in shell scripts!"
            exit 42
          fi

          # 2. YAML files (.yml): Strict syntax validation
          echo "[+] Validating YAML syntax..."
          python3 -c '
          import yaml, glob
          for f in glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True):
              if ".git" in f: continue
              try:
                  with open(f, "r") as file:
                      yaml.safe_load(file)
                  print(f"  Passed YAML: {f}")
              except Exception as e:
                  print(f"::error::YAML error in {f}: {e}")
                  exit(1)
          '

          # 3. Markdown files (.md): Structure checks
          echo "[+] Validating Markdown files..."
          python3 -c '
          import glob
          for f in glob.glob("**/*.md", recursive=True):
              if ".git" in f: continue
              with open(f, "r", encoding="utf-8") as file:
                  content = file.read()
              if content.count("```") % 2 != 0:
                  print(f"::error::Unbalanced code block fences (```) in Markdown file: {f}")
                  exit(1)
              print(f"  Passed Markdown: {f}")
          '

          # 4. Gitignore (.gitignore): Format tracking validation
          echo "[+] Validating .gitignore format..."
          if [ -f ".gitignore" ]; then
            git check-ignore -v README.md > /dev/null 2>&1 || true
            echo "  Passed .gitignore syntax check."
          fi

          echo "[+] All repository files successfully linted!"

      - name: Upload ShellCheck results to GitHub Security
        if: always() && steps.checkout.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: shellcheck-results.sarif

      - name: Format, Inject, and Push (Main Branch Only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          # Auto-format all shell scripts
          /home/runner/bin/shfmt -w -ln mksh -i 4 .

          # Re-inject script into README
          awk '/<!-- SCRIPT_START -->/{
            print
            print "```bash"
            print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
            while ((getline line < "maintenance.sh") > 0) {
              sub(/\r$/, "", line)
              print line
            }
            close("maintenance.sh")
            print "EOF"
            print "```"
            flag=1
            next
          }
          /<!-- SCRIPT_END -->/{
            flag=0
          }
          !flag' README.md > README.md.tmp && mv README.md.tmp README.md

          git add .

          if ! git diff --staged --quiet; then
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git commit --no-verify -m "style/docs: auto-format, lint, and sync repository files"
            git pull --rebase origin main
            git push
          fi
