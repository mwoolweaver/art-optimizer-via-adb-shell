name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Auto-Format All Repository Files & Inject Script
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          # Clean up any residual data files
          rm -f shellcheck-results.json shellcheck-results.sarif

          # Check if maintenance.sh was modified in the incoming commit
          WAS_IN_COMMIT=false
          if git rev-parse HEAD~1 &>/dev/null && git diff --name-only HEAD~1 HEAD | grep -q "^maintenance.sh$"; then
            WAS_IN_COMMIT=true
          fi

          # Capture maintenance.sh hash before formatting
          SH_BEFORE_HASH=$(git hash-object maintenance.sh)

          echo "[+] 1. Auto-formatting all Shell scripts (.sh)..."
          /home/runner/bin/shfmt -w -ln mksh -i 4 .

          echo "[+] 1.1. Auto-formatting all YAML files (.yml)..."
          npx --yes prettier --write "**/*.yml"

          # Check if shfmt modified maintenance.sh during this run
          SH_AFTER_HASH=$(git hash-object maintenance.sh)
          WAS_FORMATTED=false
          if [ "$SH_BEFORE_HASH" != "$SH_AFTER_HASH" ]; then
            WAS_FORMATTED=true
          fi

          echo "[+] 2. Normalizing all Markdown files (.md)..."
          python3 -c '
          import glob
          for f in glob.glob("**/*.md", recursive=True, include_hidden=True):
              if ".git/" in f or "/.git" in f: continue
              with open(f, "r", encoding="utf-8") as file:
                  lines = [line.rstrip() for line in file.readlines()]
              content = "\n".join(lines).strip() + "\n"
              with open(f, "w", encoding="utf-8") as file:
                  file.write(content)
          '

          # Capture README hash before script injection
          README_BEFORE_HASH=$(git hash-object README.md)

          echo "[+] 3. Injecting maintenance.sh into README.md..."
          awk '/<!-- SCRIPT_START -->/{
            print
            print "```bash"
            print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
            while ((getline line < "maintenance.sh") > 0) {
              sub(/\r$/, "", line)
              print line
            }
            close("maintenance.sh")
            print "EOF"
            print "```"
            flag=1
            next
          }
          /<!-- SCRIPT_END -->/{
            flag=0
          }
          !flag' README.md > README.md.tmp && mv README.md.tmp README.md

          # Check if README was updated/desynced
          README_AFTER_HASH=$(git hash-object README.md)
          README_DESYNCED=false
          if [ "$README_BEFORE_HASH" != "$README_AFTER_HASH" ]; then
            README_DESYNCED=true
          fi

          echo "=========================================="
          echo " PIPELINE EXECUTION SCENARIO REPORT:"
          if [ "$WAS_IN_COMMIT" = true ] && [ "$WAS_FORMATTED" = true ]; then
            echo " [SCENARIO 1] maintenance.sh was modified in commit AND auto-formatted by shfmt."
          elif [ "$WAS_IN_COMMIT" = true ] && [ "$WAS_FORMATTED" = false ]; then
            echo " [SCENARIO 2] maintenance.sh was modified in commit (already properly formatted)."
          elif [ "$WAS_IN_COMMIT" = false ] && [ "$WAS_FORMATTED" = true ]; then
            echo " [SCENARIO 3] maintenance.sh was unmodified in commit but formatted by shfmt during run."
          elif [ "$README_DESYNCED" = true ]; then
            echo " [SCENARIO 4] README.md script block was desynced or empty and has been re-injected."
          else
            echo " [SCENARIO 5] All files are completely clean and in sync. No changes detected."
          fi
          echo "=========================================="

      - name: Create Pull Request for File Sync
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "style/docs: auto-format, lint, and sync repository files"
          title: "style/docs: auto-format and sync repository files"
          branch: "auto-update-readme"
          base: "main"
          delete-branch: true
