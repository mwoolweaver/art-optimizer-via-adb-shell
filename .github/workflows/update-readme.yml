name: Auto-Inject Script into README

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Format and Inject Script
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "maintenance.sh" ] || [ ! -f "README.md" ]; then
            echo "::error::Required files missing!"
            exit 1
          fi

          # Clean up any residual data files
          rm -f shellcheck-results.json shellcheck-results.sarif

          # Auto-format all shell scripts
          /home/runner/bin/shfmt -w -ln mksh -i 4 .

          # Re-inject script into README
          awk '/<!-- SCRIPT_START -->/{
            print
            print "```bash"
            print "cat << \x27EOF\x27 > /sdcard/monthly/maintenance.sh"
            while ((getline line < "maintenance.sh") > 0) {
              sub(/\r$/, "", line)
              print line
            }
            close("maintenance.sh")
            print "EOF"
            print "```"
            flag=1
            next
          }
          /<!-- SCRIPT_END -->/{
            flag=0
          }
          !flag' README.md > README.md.tmp && mv README.md.tmp README.md

      - name: Create Pull Request for README Sync
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "style/docs: auto-format, lint, and sync repository files"
          title: "style/docs: auto-format and sync README.md"
          branch: "auto-update-readme"
          base: "main"
          delete-branch: true
