name: Repository Linter & Gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gatekeeper:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Lint all repository files
        shell: bash
        run: |
          set -uo pipefail

          echo "[+] Starting full repository linting..."
          has_errors=0

          # ==================================================================
          # 1. SHELL SCRIPTS
          # ==================================================================

          mapfile -t sh_files < <(
            find . -type f -name "*.sh" -not -path "./.git/*" -print
          )

          if [ "${#sh_files[@]}" -gt 0 ]; then
            echo "[+] Validating Shell scripts..."

            # --------------------------------------------------------------
            # ShellCheck
            # --------------------------------------------------------------

            echo "  Running ShellCheck: ${sh_files[*]}"

            shellcheck -s ksh -f json "${sh_files[@]}" \
              > shellcheck-results.json || true

            if jq -e 'any(.[]; .level == "error")' \
              shellcheck-results.json >/dev/null 2>&1; then

              echo "::error::ShellCheck found critical errors in Shell scripts."

              python3 -c '
          import json

          with open("shellcheck-results.json", encoding="utf-8") as f:
              diagnostics = json.load(f)

          for diagnostic in diagnostics:
              if diagnostic.get("level") != "error":
                  continue

              filename = diagnostic.get("file", "")
              line = diagnostic.get("line", 1)
              column = diagnostic.get("column", 1)
              message = diagnostic.get("message", "").replace("\n", " ")
              code = diagnostic.get("code", "")

              print(
                  f"::error file={filename},line={line},col={column}"
                  f"::[SC{code}] {message}"
              )
          '

              has_errors=1
            else
              echo "  [+] ShellCheck passed."
            fi

            # --------------------------------------------------------------
            # shfmt
            # --------------------------------------------------------------

            echo "  Checking shfmt formatting..."

            if ! shfmt -d -ln mksh -i 4 "${sh_files[@]}"; then
              echo "::error::One or more Shell scripts are not formatted according to shfmt."
              has_errors=1
            else
              echo "  [+] shfmt formatting passed."
            fi
          else
            echo "[+] No Shell scripts found."
          fi

          # ==================================================================
          # 2. YAML FILES
          # ==================================================================

          echo "[+] Validating YML syntax..."

          python3 -c '
          import glob
          import sys
          import yaml

          files = set(
              glob.glob("**/*.yml", recursive=True) +
              glob.glob(".github/**/*.yml", recursive=True)
          )

          error_count = 0

          for filename in sorted(files):
              if ".git" in filename:
                  continue

              try:
                  with open(filename, "r", encoding="utf-8") as f:
                      yaml.safe_load(f)

                  print(f"  Passed YAML: {filename}")

              except yaml.YAMLError as exc:
                  line = 1

                  if hasattr(exc, "problem_mark") and exc.problem_mark:
                      line = exc.problem_mark.line + 1

                  print(
                      f"::error file={filename},line={line}"
                      f"::YAML error: {exc}"
                  )

                  error_count += 1

              except Exception as exc:
                  print(
                      f"::error file={filename},line=1"
                      f"::YAML error: {exc}"
                  )

                  error_count += 1

          if error_count:
              sys.exit(1)
          ' || has_errors=1

          # ==================================================================
          # 3. MARKDOWN FILES
          # ==================================================================

          echo "[+] Validating Markdown files..."

          python3 -c '
          import glob
          import sys

          error_count = 0

          for filename in sorted(
              glob.glob("**/*.md", recursive=True, include_hidden=True)
          ):
              if ".git/" in filename or "/.git" in filename:
                  continue

              try:
                  with open(filename, "r", encoding="utf-8") as f:
                      lines = f.readlines()

              except Exception as exc:
                  print(
                      f"::error file={filename},line=1"
                      f"::Could not read file: {exc}"
                  )

                  error_count += 1
                  continue

              content = "".join(lines)

              if content.count("```") % 2 != 0:
                  fence_lines = [
                      index
                      for index, line in enumerate(lines, start=1)
                      if "```" in line
                  ]

                  open_line = fence_lines[-1] if fence_lines else 1

                  print(
                      f"::error file={filename},line={open_line}"
                      f"::Unbalanced code block fences (```) in Markdown file."
                  )

                  error_count += 1
                  continue

              print(f"  Passed Markdown: {filename}")

          if error_count:
              sys.exit(1)
          ' || has_errors=1

          # ==================================================================
          # FINAL RESULT
          # ==================================================================

          if [ "$has_errors" -eq 0 ]; then
            echo "[+] All repository files successfully linted!"
            exit 0
          fi

          echo "::error::Linting completed with errors."
          exit 42
